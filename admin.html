<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Gestione Catalogo | Ciccio Pubblicità</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #171717;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 { margin: 0 0 8px; font-size: 26px; }
    .brand p { margin: 0; color: #666; font-size: 14px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid #d7d7d7;
      border-radius: 9px;
      font: inherit;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .login-button { width: 100%; }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #a40000;
    }

    #dashboard {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    .dashboard-header,
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .dashboard-header { margin-bottom: 30px; }

    .dashboard-header h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .dashboard-header p {
      margin: 0;
      color: #666;
    }

    .logout-button,
    .cancel-button {
      background: #fff;
      color: #111;
      border: 1px solid #ddd;
    }

    .toolbar,
    .products-box,
    .product-form-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 25px rgba(0,0,0,.06);
    }

    .product-form-box {
      display: none;
      padding: 28px;
    }

    .product-form-box h2 {
      margin: 0 0 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 20px;
    }

    .full { grid-column: 1 / -1; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .checkbox-row label { margin: 0; }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .form-status {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .form-status.error {
      display: block;
      background: #fff0f0;
      color: #a40000;
    }

    .form-status.success {
      display: block;
      background: #eefaf1;
      color: #176b2c;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }

    .product-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 18px 5px;
      border-bottom: 1px solid #eee;
    }

    .product-row:last-child { border-bottom: 0; }

    .product-thumb,
    .product-thumb-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      background: #eee;
    }

    .product-thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .product-info strong {
      display: block;
      margin-bottom: 6px;
    }

    .product-info span {
      display: block;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .hidden-label {
      display: inline-block !important;
      width: fit-content;
      margin-top: 6px;
      padding: 4px 7px;
      background: #eee;
      color: #555 !important;
      border-radius: 5px;
      font-size: 11px !important;
      font-weight: 700;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .edit-button {
      background: #111;
    }

    .toggle-button {
      background: #555;
    }

    .delete-button {
      background: #b42318;
    }

    .current-images-box {
      grid-column: 1 / -1;
      display: none;
      margin-bottom: 20px;
    }

    .current-images-list {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }

    .gallery-item {
      width: 130px;
      padding: 8px;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      background: #fafafa;
    }

    .gallery-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 7px;
    }

    .gallery-main-label {
      display: block;
      margin-bottom: 7px;
      padding: 4px 6px;
      border-radius: 5px;
      background: #e9f7ed;
      color: #176b2c;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }

    .gallery-remove-button {
      width: 100%;
      padding: 8px;
      background: #b42318;
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .dashboard-header,
      .toolbar,
      .form-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full { grid-column: auto; }

      .product-row {
        grid-template-columns: 70px 1fr;
      }

      .product-thumb,
      .product-thumb-placeholder {
        width: 70px;
        height: 70px;
      }

      .product-actions {
        grid-column: 1 / -1;
        justify-content: stretch;
      }

      .product-actions button {
        flex: 1;
      }

      .dashboard-header button,
      .toolbar button,
      .form-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="loginSection" class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <h1>Ciccio Pubblicità</h1>
        <p>Gestione Catalogo</p>
      </div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" id="loginButton" class="login-button">
          ACCEDI
        </button>

        <div id="message"></div>
      </form>
    </div>
  </div>

  <main id="dashboard">

    <div class="dashboard-header">
      <div>
        <h1>Gestione Catalogo</h1>
        <p>Ciccio Pubblicità</p>
      </div>

      <button id="logoutButton" class="logout-button">ESCI</button>
    </div>

    <div id="productFormBox" class="product-form-box">

      <h2 id="formTitle">Aggiungi prodotto</h2>

      <div id="formStatus" class="form-status"></div>

      <form id="productForm">

        <div class="form-grid">

          <div>
            <label for="productName">Nome prodotto *</label>
            <input type="text" id="productName" required>
          </div>

          <div>
            <label for="productCode">Codice articolo</label>
            <input type="text" id="productCode">
          </div>

          <div class="full">
            <label for="productDescription">Descrizione</label>
            <textarea id="productDescription"></textarea>
          </div>

          <div>
            <label for="productPrice">Prezzo (€)</label>
            <input type="number" id="productPrice" min="0" step="0.01">
          </div>

          <div>
            <label for="productQuantity">Quantità / minimo ordine</label>
            <input type="text" id="productQuantity" placeholder="Es. 100 pezzi">
          </div>

          <div>
            <label for="productCategory">Categoria</label>
            <input type="text" id="productCategory">
          </div>

          <div>
            <label for="productPage">Pagina catalogo</label>
            <input type="text" id="productPage">
          </div>

          <div class="full">
            <label for="productOffer">Testo offerta</label>
            <input type="text" id="productOffer">
          </div>

          <div>
            <label for="productOrder">Ordine visualizzazione</label>
            <input type="number" id="productOrder" value="0" step="1">
          </div>

          <div>
            <label for="productImage">Foto prodotto</label>
            <input
              type="file"
              id="productImage"
              accept="image/jpeg"
              multiple
            >
          </div>

          <div id="currentImagesBox" class="current-images-box">
            <label>Immagini attuali</label>
            <div id="currentImagesList" class="current-images-list"></div>
          </div>

          <div class="full checkbox-row">
            <input type="checkbox" id="productActive" checked>
            <label for="productActive">Prodotto visibile nel catalogo</label>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" id="saveProductButton">
            SALVA PRODOTTO
          </button>

          <button type="button" id="cancelProductButton" class="cancel-button">
            ANNULLA
          </button>
        </div>

      </form>
    </div>

    <div class="toolbar">
      <div>
        <strong>Prodotti</strong>
      </div>

      <button id="addProductButton">
        + AGGIUNGI PRODOTTO
      </button>
    </div>

    <div class="products-box">
      <div id="productsList">
        <div class="empty-state">Caricamento prodotti...</div>
      </div>
    </div>

  </main>

  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let productsCache = [];
    let editingProductId = null;
    let existingImageUrl = null;
    let editingImages = [];

    const loginSection = document.getElementById("loginSection");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const message = document.getElementById("message");

    const productsList = document.getElementById("productsList");
    const addProductButton = document.getElementById("addProductButton");
    const productFormBox = document.getElementById("productFormBox");
    const productForm = document.getElementById("productForm");
    const cancelProductButton = document.getElementById("cancelProductButton");
    const saveProductButton = document.getElementById("saveProductButton");
    const formStatus = document.getElementById("formStatus");
    const formTitle = document.getElementById("formTitle");
    const currentImagesBox = document.getElementById("currentImagesBox");
    const currentImagesList = document.getElementById("currentImagesList");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function showFormStatus(text, type) {
      formStatus.textContent = text;
      formStatus.className = "form-status " + type;
    }

    function clearFormStatus() {
      formStatus.textContent = "";
      formStatus.className = "form-status";
    }

    function showDashboard() {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      loadProducts();
    }

    function showLogin() {
      dashboard.style.display = "none";
      loginSection.style.display = "flex";
    }

    function renderCurrentImages() {
      currentImagesList.innerHTML = "";

      if (!editingProductId || editingImages.length === 0) {
        currentImagesBox.style.display = "none";
        return;
      }

      currentImagesBox.style.display = "block";

      editingImages.forEach(function(url, index) {
        const item = document.createElement("div");
        item.className = "gallery-item";

        const image = document.createElement("img");
        image.src = url;
        image.alt = "Immagine prodotto " + (index + 1);
        item.appendChild(image);

        if (index === 0) {
          const mainLabel = document.createElement("span");
          mainLabel.className = "gallery-main-label";
          mainLabel.textContent = "PRINCIPALE";
          item.appendChild(mainLabel);
        }

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "gallery-remove-button";
        removeButton.textContent = "RIMUOVI";
        removeButton.addEventListener("click", function() {
          removeGalleryImage(index);
        });

        item.appendChild(removeButton);
        currentImagesList.appendChild(item);
      });
    }

    async function removeGalleryImage(index) {
      const imageUrl = editingImages[index];
      if (!imageUrl) return;

      if (!confirm("Vuoi rimuovere questa immagine dal prodotto?")) return;

      const previousImages = [...editingImages];
      editingImages.splice(index, 1);
      existingImageUrl = editingImages[0] || null;

      const { error } = await supabaseClient
        .from("products")
        .update({
          images: editingImages,
          image_url: existingImageUrl,
          updated_at: new Date().toISOString()
        })
        .eq("id", editingProductId);

      if (error) {
        editingImages = previousImages;
        existingImageUrl = editingImages[0] || null;
        alert("Errore durante la rimozione dell'immagine.");
        console.error(error);
        renderCurrentImages();
        return;
      }

      await removeStorageImage(imageUrl);

      const cachedProduct = productsCache.find(function(item) {
        return item.id === editingProductId;
      });

      if (cachedProduct) {
        cachedProduct.images = [...editingImages];
        cachedProduct.image_url = existingImageUrl;
      }

      renderCurrentImages();
      await loadProducts();
    }

    function resetProductForm() {
      productForm.reset();
      editingProductId = null;
      existingImageUrl = null;
      editingImages = [];
      currentImagesList.innerHTML = "";
      currentImagesBox.style.display = "none";
      formTitle.textContent = "Aggiungi prodotto";
      saveProductButton.textContent = "SALVA PRODOTTO";
      document.getElementById("productActive").checked = true;
      document.getElementById("productOrder").value = 0;
      clearFormStatus();
    }

    function openNewProductForm() {
      resetProductForm();
      productFormBox.style.display = "block";
      productFormBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeProductForm() {
      productFormBox.style.display = "none";
      resetProductForm();
    }

    function getStoragePathFromUrl(url) {
      if (!url) return null;

      const marker = "/storage/v1/object/public/product-images/";
      const index = url.indexOf(marker);

      if (index === -1) return null;

      return decodeURIComponent(url.substring(index + marker.length));
    }

    async function removeStorageImage(imageUrl) {
      const path = getStoragePathFromUrl(imageUrl);

      if (!path) return;

      const { error } = await supabaseClient.storage
        .from("product-images")
        .remove([path]);

      if (error) {
        console.warn("Impossibile eliminare la vecchia immagine:", error);
      }
    }

    async function loadProducts() {
      productsList.innerHTML =
        '<div class="empty-state">Caricamento prodotti...</div>';

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("sort_order", { ascending: true })
        .order("id", { ascending: true });

      if (error) {
        console.error(error);
        productsList.innerHTML =
          '<div class="empty-state">Errore durante il caricamento dei prodotti.</div>';
        return;
      }

      productsCache = data || [];

      if (productsCache.length === 0) {
        productsList.innerHTML =
          '<div class="empty-state">Nessun prodotto presente.</div>';
        return;
      }

      productsList.innerHTML = "";

      productsCache.forEach(function(product) {
        const row = document.createElement("div");
        row.className = "product-row";

        if (product.image_url) {
          const image = document.createElement("img");
          image.className = "product-thumb";
          image.src = product.image_url;
          image.alt = product.name || "Prodotto";
          row.appendChild(image);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "product-thumb-placeholder";
          placeholder.textContent = "Nessuna foto";
          row.appendChild(placeholder);
        }

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("strong");
        name.textContent = product.name || "Prodotto senza nome";

        const details = document.createElement("span");
        const detailsArray = [];

        if (product.code) detailsArray.push("Cod. " + product.code);

        if (product.price !== null && product.price !== undefined) {
          detailsArray.push(
            "€ " +
            Number(product.price).toLocaleString("it-IT", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            })
          );
        }

        if (product.quantity) detailsArray.push(product.quantity);
        if (product.category) detailsArray.push(product.category);

        details.textContent =
          detailsArray.length ? detailsArray.join(" · ") : "Nessun dettaglio";

        info.appendChild(name);
        info.appendChild(details);

        if (!product.active) {
          const hidden = document.createElement("span");
          hidden.className = "hidden-label";
          hidden.textContent = "NASCOSTO";
          info.appendChild(hidden);
        }

        row.appendChild(info);

        const actions = document.createElement("div");
        actions.className = "product-actions";

        const editButton = document.createElement("button");
        editButton.className = "edit-button";
        editButton.textContent = "MODIFICA";
        editButton.addEventListener("click", function() {
          editProduct(product.id);
        });

        const toggleButton = document.createElement("button");
        toggleButton.className = "toggle-button";
        toggleButton.textContent = product.active ? "NASCONDI" : "MOSTRA";
        toggleButton.addEventListener("click", function() {
          toggleProduct(product.id, product.active);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "ELIMINA";
        deleteButton.addEventListener("click", function() {
          deleteProduct(product.id);
        });

        actions.appendChild(editButton);
        actions.appendChild(toggleButton);
        actions.appendChild(deleteButton);

        row.appendChild(actions);
        productsList.appendChild(row);
      });
    }

    function editProduct(id) {
      const product = productsCache.find(function(item) {
        return item.id === id;
      });

      if (!product) return;

      editingProductId = product.id;

      if (Array.isArray(product.images) && product.images.length > 0) {
        editingImages = [...product.images];
      } else if (product.image_url) {
        editingImages = [product.image_url];
      } else {
        editingImages = [];
      }

      existingImageUrl = editingImages[0] || product.image_url || null;

      formTitle.textContent = "Modifica prodotto";
      saveProductButton.textContent = "SALVA MODIFICHE";

      document.getElementById("productName").value = product.name || "";
      document.getElementById("productCode").value = product.code || "";
      document.getElementById("productDescription").value = product.description || "";
      document.getElementById("productPrice").value =
        product.price !== null && product.price !== undefined ? product.price : "";
      document.getElementById("productQuantity").value = product.quantity || "";
      document.getElementById("productCategory").value = product.category || "";
      document.getElementById("productPage").value = product.page || "";
      document.getElementById("productOffer").value = product.offer_text || "";
      document.getElementById("productOrder").value = product.sort_order ?? 0;
      document.getElementById("productActive").checked = product.active !== false;
      document.getElementById("productImage").value = "";

      clearFormStatus();
      renderCurrentImages();
      productFormBox.style.display = "block";
      productFormBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function toggleProduct(id, currentState) {
      const action = currentState ? "nascondere" : "mostrare";

      if (!confirm("Vuoi davvero " + action + " questo prodotto?")) {
        return;
      }

      const { error } = await supabaseClient
        .from("products")
        .update({
          active: !currentState,
          updated_at: new Date().toISOString()
        })
        .eq("id", id);

      if (error) {
        alert("Errore durante l'operazione.");
        console.error(error);
        return;
      }

      await loadProducts();
    }

    async function deleteProduct(id) {
      const product = productsCache.find(function(item) {
        return item.id === id;
      });

      if (!product) return;

      const confirmed = confirm(
        'Vuoi eliminare definitivamente "' +
        (product.name || "questo prodotto") +
        '"?\n\nQuesta operazione non può essere annullata.'
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Errore durante l'eliminazione.");
        console.error(error);
        return;
      }

      if (product.image_url) {
        await removeStorageImage(product.image_url);
      }

      if (editingProductId === id) {
        closeProductForm();
      }

      await loadProducts();
    }

    async function uploadProductImage(file) {
  if (!file) return null;

  const extension = file.name.split(".").pop().toLowerCase();

  const safeFileName =
    Date.now() +
    "-" +
    Math.random().toString(36).substring(2, 10) +
    "." +
    extension;

  const { error: uploadError } = await supabaseClient.storage
    .from("product-images")
    .upload(safeFileName, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (uploadError) throw uploadError;

  const { data } = supabaseClient.storage
    .from("product-images")
    .getPublicUrl(safeFileName);

  return data.publicUrl;
}


async function uploadProductImages(files) {
  const uploadedUrls = [];

  for (const file of files) {

    if (file.type !== "image/jpeg") {
      throw new Error(
        "Per ora puoi caricare solamente immagini JPG/JPEG."
      );
    }

    if (file.size > 5 * 1024 * 1024) {
      throw new Error(
        "Una delle immagini supera il limite massimo di 5 MB."
      );
    }

    const imageUrl = await uploadProductImage(file);

    if (imageUrl) {
      uploadedUrls.push(imageUrl);
    }
  }

  return uploadedUrls;
}

    productForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearFormStatus();

      saveProductButton.disabled = true;
      saveProductButton.textContent = "SALVATAGGIO...";

      try {
        const name = document.getElementById("productName").value.trim();
        const code = document.getElementById("productCode").value.trim();
        const description =
          document.getElementById("productDescription").value.trim();
        const priceValue = document.getElementById("productPrice").value;
        const quantity =
          document.getElementById("productQuantity").value.trim();
        const category =
          document.getElementById("productCategory").value.trim();
        const page = document.getElementById("productPage").value.trim();
        const offerText =
          document.getElementById("productOffer").value.trim();
        const sortOrderValue =
          document.getElementById("productOrder").value;
        const active = document.getElementById("productActive").checked;
        const imageFiles = Array.from(
  document.getElementById("productImage").files
);

        if (!name) {
          throw new Error("Inserisci il nome del prodotto.");
        }

        let imageUrl = existingImageUrl;
        let currentImages = editingProductId ? [...editingImages] : [];

        if (imageFiles.length > 0) {
          const newImageUrls = await uploadProductImages(imageFiles);
          currentImages = currentImages.concat(newImageUrls);
        }

        imageUrl = currentImages.length > 0 ? currentImages[0] : null;
}

        const productData = {
          name: name,
          code: code || null,
          description: description || null,
          price: priceValue !== "" ? Number(priceValue) : null,
          quantity: quantity || null,
          category: category || null,
          page: page || null,
          offer_text: offerText || null,
          image_url: imageUrl || null,
          images: currentImages,
          active: active,
          sort_order:
            sortOrderValue !== "" ? parseInt(sortOrderValue, 10) : 0,
          updated_at: new Date().toISOString()
        };

        let error;

        if (editingProductId) {
          const result = await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", editingProductId);

          error = result.error;
        } else {
          const result = await supabaseClient
            .from("products")
            .insert(productData);

          error = result.error;
        }

        if (error) throw error;

        showFormStatus(
          editingProductId
            ? "Prodotto modificato correttamente."
            : "Prodotto salvato correttamente.",
          "success"
        );

        await loadProducts();

        const wasEditing = editingProductId !== null;

        editingProductId = null;
        existingImageUrl = null;
        editingImages = [];
        currentImagesList.innerHTML = "";
        currentImagesBox.style.display = "none";

        productForm.reset();
        document.getElementById("productActive").checked = true;
        document.getElementById("productOrder").value = 0;

        if (wasEditing) {
          formTitle.textContent = "Aggiungi prodotto";
          saveProductButton.textContent = "SALVA PRODOTTO";
        }

      } catch (error) {
        console.error(error);

        showFormStatus(
          error.message ||
          "Si è verificato un errore durante il salvataggio.",
          "error"
        );
      } finally {
        saveProductButton.disabled = false;

        if (editingProductId) {
          saveProductButton.textContent = "SALVA MODIFICHE";
        } else {
          saveProductButton.textContent = "SALVA PRODOTTO";
        }
      }
    });

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "ACCESSO...";
      message.style.display = "none";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        showMessage("Email o password non corretti.", "error");
        loginButton.disabled = false;
        loginButton.textContent = "ACCEDI";
        return;
      }

      loginButton.disabled = false;
      loginButton.textContent = "ACCEDI";
      showDashboard();
    });

    logoutButton.addEventListener("click", async function() {
      await supabaseClient.auth.signOut();
      loginForm.reset();
      closeProductForm();
      showLogin();
    });

    addProductButton.addEventListener("click", openNewProductForm);
    cancelProductButton.addEventListener("click", closeProductForm);

    async function checkSession() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    checkSession();
  </script>

</body>
</html>
